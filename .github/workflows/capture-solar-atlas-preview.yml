name: Capture Solar Atlas preview

on:
  push:
    branches:
      - feat/solar-system-explorer
    paths:
      - index.html

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve Solar Atlas
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/solar-atlas-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/solar-atlas-http.log
          exit 1
      - name: Capture complete atlas overview
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1600, height: 900 },
              deviceScaleFactor: 1
            });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.evaluate(() => document.fonts.ready);
            await page.addStyleTag({ content: `
              .hero { padding: 22px 0 18px; gap: 24px; }
              .hero h1 { font-size: clamp(2.7rem, 3.1vw, 3.35rem); line-height: .96; }
              .hero-description { max-width: 540px; margin-top: 12px; font-size: .79rem; line-height: 1.5; }
              .system-counts { gap: 11px; padding-left: 17px; }
              .count-item strong { font-size: 2rem; }
              .explorer-layout { gap: 15px; }
              .map-column { padding: 17px 18px 12px; }
              .map-heading { margin-bottom: 7px; }
              .solar-map { height: 315px; }
              .map-legend { padding-top: 10px; gap: 11px; }
              .detail-panel { padding: 15px 17px 12px; }
              .detail-visual { height: 112px; margin: 2px 0; }
              .detail-visual img { width: 100px; height: 100px; }
              .detail-title-row { margin-top: 2px; }
              .detail-title-row h2 { font-size: 1.9rem; }
              .detail-lead { margin: 8px 0; font-size: .7rem; line-height: 1.45; }
              .temperature-line { padding: 7px 0; }
              .detail-stats { margin: 2px 0 8px; }
              .stat { padding: 6px 0; gap: 3px; }
              .detail-facts { gap: 8px 12px; margin-top: 8px; }
              .detail-facts p { font-size: .6rem; line-height: 1.4; }
              .highlight-section { margin-top: 10px; padding: 9px 10px; }
              .highlight-section div > p:last-child { font-size: .6rem; line-height: 1.4; }
              .mission-section { margin-top: 9px; }
              .mission-section > p:last-child { font-size: .6rem; line-height: 1.4; }
              .source-link { padding-top: 8px; }
            `});
            await page.waitForFunction(() => {
              const images = [...document.querySelectorAll('.map-world img, #detail-image')];
              return images.length === 10 && images.every(img => img.complete && img.naturalWidth > 0);
            }, { timeout: 30000 });
            await page.screenshot({ path: 'solar-atlas-preview.png', animations: 'disabled' });
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Optimize screenshot as WebP
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          with Image.open("solar-atlas-preview.png") as image:
              image.convert("RGB").save("solar-atlas-preview.webp", "WEBP", quality=88, method=6)
          PY
      - name: Save screenshot to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solar-atlas-preview.webp
          git commit -m "Add complete Solar Atlas card screenshot [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
