name: Capture Solar Atlas preview

on:
  push:
    branches:
      - feat/solar-system-explorer
    paths:
      - index.html

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve Solar Atlas
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/solar-atlas-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/solar-atlas-http.log
          exit 1
      - name: Capture desktop screenshot
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1600, height: 1180 },
              deviceScaleFactor: 1
            });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.evaluate(() => document.fonts.ready);
            await page.waitForFunction(() => {
              const images = [...document.querySelectorAll('.map-world img, #detail-image')];
              return images.length === 9 && images.every(img => img.complete && img.naturalWidth > 0);
            }, { timeout: 30000 });
            await page.screenshot({
              path: 'solar-atlas-preview.png',
              animations: 'disabled'
            });
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar-atlas-preview
          path: solar-atlas-preview.png
          if-no-files-found: error
          retention-days: 3
